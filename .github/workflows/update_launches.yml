name: Daily Launch Data Update

on:
  schedule:
    # ogni giorno alle 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-launches:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Python setup
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Run launcher extraction script
      # --------------------------------------------------
      - name: Run estrai_dati_lanci.py
        run: python estrai_dati_lanci.py

      # --------------------------------------------------
      # Verify output file exists
      # --------------------------------------------------
      - name: Verify last_launches.txt exists
        run: |
          if [ ! -f last_launches.txt ]; then
            echo "File last_launches.txt non trovato!"
            exit 1
          fi

      # --------------------------------------------------
      # Run import/update script
      # --------------------------------------------------
      - name: Run import_launch_loop_update_local.py
        run: python import_launch_loop_update_local.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
